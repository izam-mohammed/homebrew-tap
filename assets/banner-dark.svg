<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="homebrew-tap: a bar with two beer taps labelled claim and penpot-mcp. the claim glass is full, the penpot-mcp glass overflows. a chalkboard lists what is on tap, says the bartender is goreleaser, and warns do not hand-edit">
  <title>homebrew-tap</title>
  <rect width="1280" height="360" fill="#0f1115"/>

  <!-- the title -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="122" font-size="52" font-weight="800" fill="#e6e3da">homebrew-tap</text>
    <text x="50" y="160" font-size="19" fill="#a8adb8">two things on tap.</text>
    <text x="50" y="186" font-size="19" fill="#a8adb8">both poured by a robot.</text>
    <text x="50" y="224" font-size="19" font-style="italic" fill="#f87171">no, you can't pour your own.</text>
    <text x="50" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7d8594">brew tap izam-mohammed/tap</text>
  </g>

  <!-- the scene -->
  <g>
    <!-- the counter -->
    <rect x="470" y="282" width="330" height="14" rx="3" fill="#b07a45"/>
    <rect x="478" y="296" width="314" height="40" fill="#8a5a2e"/>
    <path d="M478 310 h314 M478 324 h314" stroke="#7a4e26" stroke-width="2"/>

    <!-- the tower -->
    <rect x="512" y="138" width="246" height="22" rx="10" fill="#c9ccd1" stroke="#9aa0a8" stroke-width="2"/>
    <rect x="618" y="158" width="34" height="124" fill="#c9ccd1" stroke="#9aa0a8" stroke-width="2"/>
    <rect x="606" y="272" width="58" height="12" rx="3" fill="#9aa0a8"/>
    <rect x="626" y="166" width="6" height="100" rx="3" fill="#ffffff" opacity="0.5"/>

    <!-- tap: claim -->
    <path d="M548 160 v18 q0 8 8 8 h4" stroke="#9aa0a8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="534" y="52" width="34" height="90" rx="10" fill="#d97706"/>
    <rect x="540" y="58" width="8" height="78" rx="4" fill="#ffffff" opacity="0.25"/>
    <text transform="translate(557 128) rotate(-90)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1c1c1a">claim</text>

    <!-- tap: penpot-mcp -->
    <path d="M714 160 v18 q0 8 8 8 h4" stroke="#9aa0a8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="700" y="40" width="34" height="102" rx="10" fill="#6d5bd0"/>
    <rect x="706" y="46" width="8" height="90" rx="4" fill="#ffffff" opacity="0.25"/>
    <text transform="translate(723 134) rotate(-90)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff">penpot-mcp</text>

    <!-- glass: claim, a proper pint -->
    <path d="M532 206 h56 l-6 76 h-44 z" fill="#ffffff" opacity="0.55" stroke="#9aa0a8" stroke-width="2"/>
    <path d="M535 228 h50 l-4 52 h-42 z" fill="#f2a93b"/>
    <path d="M533 228 q8 -12 16 -4 q8 -10 16 -2 q8 -8 18 0 l2 10 h-52 z" fill="#fffaf0" stroke="#e2cfa3" stroke-width="1.5"/>
    <circle cx="552" cy="252" r="2" fill="#fffaf0" opacity="0.8"/><circle cx="566" cy="264" r="1.5" fill="#fffaf0" opacity="0.8"/>

    <!-- glass: penpot-mcp, overflowing -->
    <path d="M722 192 v14" stroke="#f2a93b" stroke-width="4" stroke-linecap="round"/>
    <path d="M698 206 h56 l-6 76 h-44 z" fill="#ffffff" opacity="0.55" stroke="#9aa0a8" stroke-width="2"/>
    <path d="M700 214 h52 l-5 66 h-42 z" fill="#f2a93b"/>
    <path d="M694 214 q6 -16 18 -8 q8 -14 20 -4 q10 -10 22 2 q4 8 -4 10 h-52 q-8 -2 -4 0 z" fill="#fffaf0" stroke="#e2cfa3" stroke-width="1.5"/>
    <path d="M697 214 q-4 18 -2 34 q2 6 5 0 q1 -14 2 -30 z" fill="#fffaf0"/>
    <path d="M755 214 q5 22 2 40 q-2 6 -5 0 q0 -18 -1 -36 z" fill="#fffaf0"/>
    <ellipse cx="770" cy="284" rx="24" ry="4" fill="#f2a93b" opacity="0.6"/>
    <text x="772" y="270" font-family="'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="13" fill="#d9a066">(v0.1.6)</text>
    <text x="772" y="256" font-family="'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="13" fill="#d9a066">3 refills</text>

    <!-- the chalkboard -->
    <g transform="translate(846 30)">
      <rect width="388" height="296" rx="10" fill="#8a5a2e"/>
      <rect x="12" y="12" width="364" height="272" rx="4" fill="#1f2a24"/>
      <g font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" fill="#f1efe6">
        <text x="194" y="52" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="3">ON TAP</text>
        <path d="M120 62 h148" stroke="#f1efe6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

        <text x="34" y="100" font-size="18" fill="#fbbf24">claim</text>
        <text x="342" y="100" font-size="15" text-anchor="end" opacity="0.8">0.1.0</text>
        <text x="34" y="122" font-size="13" opacity="0.85">strips "Co-Authored-By: Claude".</text>
        <text x="34" y="140" font-size="13" opacity="0.85">you wrote it all yourself. sure.</text>

        <text x="34" y="178" font-size="18" fill="#a99cf0">penpot-mcp</text>
        <text x="342" y="178" font-size="15" text-anchor="end" opacity="0.8">0.1.6</text>
        <text x="34" y="200" font-size="13" opacity="0.85">design without opening the design app.</text>
        <text x="34" y="218" font-size="13" opacity="0.85">the designer is fine. probably.</text>

        <path d="M34 238 h320" stroke="#f1efe6" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
        <text x="34" y="262" font-size="13" opacity="0.75">bartender: goreleaser · do not hand-edit</text>
      </g>
    </g>
  </g>
</svg>
