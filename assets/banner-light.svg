<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">homebrew-tap</title>
  <desc id="d">A vending machine with nine slots and two things in it: A1 app 1 and A2 app 2, both free. The sign on top says two things, no refunds. A note taped to the wall explains how to buy: brew tap izam-mohammed/tap, then brew install the app. It's free, stop lookin' for coins. A robot carrying a crate of releases says: do not hand-edit. i will know.</desc>

  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
    <g id="coil" fill="none" stroke="#8c959f" stroke-width="2">
      <ellipse cx="-24" cy="0" rx="6" ry="9"/><ellipse cx="-8" cy="0" rx="6" ry="9"/>
      <ellipse cx="8" cy="0" rx="6" ry="9"/><ellipse cx="24" cy="0" rx="6" ry="9"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#f1f3f5"/>
    <rect y="384" width="1200" height="16" fill="#d5d9de"/>

    <!-- the how-to, taped up by someone who's been asked twice -->
    <g transform="rotate(-2 210 205)">
      <rect x="58" y="114" width="318" height="186" fill="#000000" fill-opacity="0.10" transform="translate(4 6)"/>
      <rect x="58" y="114" width="318" height="186" fill="#fffef5"/>
      <rect x="44" y="104" width="56" height="20" fill="#e3dcb8" fill-opacity="0.85" transform="rotate(-30 72 114)"/>
      <rect x="334" y="104" width="56" height="20" fill="#e3dcb8" fill-opacity="0.85" transform="rotate(30 362 114)"/>
      <text x="80" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#1f2328">how to buy:</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1f2328">
                <text x="80" y="207">brew tap izam-mohammed/tap</text>
        <text x="80" y="239">brew install &lt;app&gt;</text>
      </g>
      <text x="80" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-style="italic" font-size="14" fill="#59636e">(it's free. stop lookin' for coins.)</text>
    </g>

    <!-- the machine -->
    <rect x="436" y="376" width="30" height="10" fill="#111418"/><rect x="714" y="376" width="30" height="10" fill="#111418"/>
    <rect x="410" y="20" width="360" height="358" rx="16" fill="#c0392b" stroke="#962d22" stroke-width="3"/>
    <rect x="426" y="34" width="328" height="42" rx="6" fill="#1f2328"/>
    <text x="590" y="62" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" fill="#ffd84d">TWO THINGS. NO REFUNDS.</text>

    <rect x="426" y="88" width="240" height="236" rx="6" fill="#dfeef7" stroke="#962d22" stroke-width="2"/>
    <g fill="#9aa4b2">
      <rect x="426" y="160" width="240" height="5"/><rect x="426" y="232" width="240" height="5"/><rect x="426" y="304" width="240" height="5"/>
    </g>
    <use href="#coil" transform="translate(466 152)"/><use href="#coil" transform="translate(546 152)"/><use href="#coil" transform="translate(626 152)"/>
    <use href="#coil" transform="translate(466 224)"/><use href="#coil" transform="translate(546 224)"/><use href="#coil" transform="translate(626 224)"/>
    <use href="#coil" transform="translate(466 296)"/><use href="#coil" transform="translate(546 296)"/><use href="#coil" transform="translate(626 296)"/>

    <!-- A1, A2. that's the menu -->
    <path d="M442 110 l4 -6 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6 l4 6 v40 q-24 6 -48 0 z" fill="#f08c00"/>
    <text x="466" y="136" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff">app 1</text>
    <rect x="520" y="102" width="52" height="50" rx="5" fill="#6f42c1"/>
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">
      <text x="546" y="131">app 2</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#3d444d" text-anchor="middle">
      <text x="466" y="178">A1 · free</text><text x="546" y="178">A2 · free</text><text x="626" y="178">A3</text>
      <text x="466" y="250">B1</text><text x="546" y="250">B2</text><text x="626" y="250">B3</text>
      <text x="466" y="320">C1</text><text x="546" y="320">C2</text><text x="626" y="320">C3</text>
    </g>
    <polygon points="610,88 640,88 548,324 518,324" fill="#ffffff" fill-opacity="0.40"/>
    <polygon points="652,88 662,88 572,324 562,324" fill="#ffffff" fill-opacity="0.40"/>

    <rect x="678" y="88" width="76" height="236" rx="6" fill="#2d333b"/>
    <rect x="686" y="98" width="60" height="28" rx="3" fill="#0e2a17"/>
    <text x="716" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#3fb950">A1</text>
    <g fill="#d0d7de" stroke="#8c959f">
      <circle cx="696" cy="148" r="7"/><circle cx="716" cy="148" r="7"/><circle cx="736" cy="148" r="7"/>
      <circle cx="696" cy="170" r="7"/><circle cx="716" cy="170" r="7"/><circle cx="736" cy="170" r="7"/>
      <circle cx="696" cy="192" r="7"/><circle cx="716" cy="192" r="7"/><circle cx="736" cy="192" r="7"/>
      <circle cx="696" cy="214" r="7"/><circle cx="716" cy="214" r="7"/><circle cx="736" cy="214" r="7"/>
    </g>
    <rect x="712" y="240" width="8" height="30" rx="2" fill="#111418"/>
    <rect x="694" y="286" width="44" height="24" rx="4" fill="#111418"/>

    <rect x="426" y="336" width="240" height="30" rx="4" fill="#2d333b"/>
    <text x="546" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#c9d1d9">PUSH</text>

    <!-- goreleaser, restocking, slightly annoyed -->
    <rect x="884" y="350" width="11" height="36" fill="#57606a"/><rect x="906" y="350" width="11" height="36" fill="#57606a"/>
    <rect x="868" y="270" width="64" height="86" rx="10" fill="#a7b1bf"/>
    <line x1="900" y1="214" x2="900" y2="198" stroke="#57606a" stroke-width="3"/>
    <circle cx="900" cy="195" r="5" fill="#f08c00"/>
    <rect x="873" y="214" width="54" height="48" rx="10" fill="#a7b1bf"/>
    <rect x="894" y="262" width="12" height="9" fill="#57606a"/>
    <circle cx="888" cy="240" r="6" fill="#0891b2"/><circle cx="912" cy="240" r="6" fill="#0891b2"/>
    <path d="M880 228 l14 5 M920 228 l-14 5" stroke="#57606a" stroke-width="3" stroke-linecap="round"/>
    <rect x="891" y="252" width="18" height="3.5" rx="1.5" fill="#57606a"/>
    <rect x="846" y="300" width="108" height="52" rx="3" fill="#c8a46a" stroke="#8a6a3e" stroke-width="2"/>
    <line x1="846" y1="316" x2="954" y2="316" stroke="#8a6a3e" stroke-width="2"/>
    <text x="900" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#3b2a12">releases</text>
    <rect x="838" y="298" width="12" height="22" rx="4" fill="#57606a"/><rect x="950" y="298" width="12" height="22" rx="4" fill="#57606a"/>

    <path d="M960 150 h196 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-150 l-26 18 l6 -18 h-26 a12 12 0 0 1 -12 -12 v-52 a12 12 0 0 1 12 -12 z" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#1f2328">
      <text x="966" y="182">do not hand-edit.</text>
      <text x="966" y="208" font-weight="700">i will know.</text>
    </g>
  </g>
</svg>
